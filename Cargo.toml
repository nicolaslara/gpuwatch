[package]
name = "gpuwatch"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Detects sustained GPU thermal throttling inside a Modal container and reports it"
license = "MIT"
repository = "https://github.com/modal-projects/gpuwatch"

[dependencies]
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
