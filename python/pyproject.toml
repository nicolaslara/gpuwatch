[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modal-gpuwatch"
version = "0.1.0"
description = "Detects sustained GPU thermal throttling inside a Modal container and reports it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.6"
classifiers = ["Operating System :: POSIX :: Linux"]

[project.urls]
Repository = "https://github.com/modal-projects/gpuwatch"

[tool.hatch.build.targets.wheel]
packages = ["gpuwatch"]
artifacts = ["gpuwatch/bin/gpuwatch"]

[tool.hatch.build.targets.wheel.force-include]
"gpuwatch_boot.pth" = "gpuwatch_boot.pth"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
