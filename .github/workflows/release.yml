name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gpuwatch
            dist/entrypoint.sh
            dist/install.sh
            dist/*.whl
  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: the PyPI project modal-gpuwatch trusts this repo,
    # this workflow and this environment; no token is stored.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
